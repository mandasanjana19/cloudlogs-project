services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=cloudlog
    env_file: ./hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data:/data
    mem_limit: 1536m #The mem_limit lines are safety net, so no single container can eat all our RAM

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file: ./hadoop.env
    depends_on:
      - namenode
    volumes:
      - datanode_data:/hadoop/dfs/data
    mem_limit: 1536m
#Two Kafka listeners are needed: kafka:19092 for containers, 
#and localhost:9092 for anything on your Windows side

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092 #two kafka listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g

  app:
    build: .
    container_name: cloudlog-app
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      - namenode
      - datanode
      - kafka
    ports:
      - "8501:8501"   # Streamlit dashboard
      - "4040:4040"   # Spark UI
    volumes:
      - ./:/workspace
      - ivy_cache:/root/.ivy2
    environment:
      - PYTHONUNBUFFERED=1
    mem_limit: 5g

volumes:
  namenode_data:
  datanode_data:
  ivy_cache:

  # build prepares the environment (docker compose build); 
  # up starts the services; (docker compose up -d)
  # ps checks their status. (docker compose ps)